<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Visibility API Privacy PoC</title><style>
body{font:16px system-ui,sans-serif;margin:24px;background:white;color:#222}button{font:inherit;padding:12px 20px;margin:8px;border:1px solid #aaa;border-radius:8px}#privacy{display:none;position:fixed;inset:0;background:#111;color:white;z-index:99999;flex-direction:column;align-items:center;justify-content:center;text-align:center}body.privacy-shield #privacy{display:flex}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px;max-height:240px;overflow:auto}
</style></head><body><h1>Visibility API PoC</h1><h2>Confidential: $25,000</h2><label><input type="checkbox" id="auto"> Auto-unlock on return</label><p id="state"></p><button id="manual">Test mask</button><button id="clear">Clear log</button><pre id="log"></pre><div id="privacy"><h2>🔒 Privacy Screen</h2><p id="reason"></p><button id="reset">Reset / Unlock</button></div><script>
const $=id=>document.getElementById(id);let events=[];function log(s){events.unshift(new Date().toISOString()+' '+s);$('log').textContent=events.slice(0,40).join('\n');$('state').textContent='Visibility: '+document.visibilityState;}function lock(s){$('reason').textContent=s;document.body.classList.add('privacy-shield');}function unlock(){document.body.classList.remove('privacy-shield');}document.addEventListener('visibilitychange',()=>{log('visibilitychange: '+document.visibilityState);if(document.hidden)lock('Page became hidden');else if($('auto').checked)unlock();});$('reset').onclick=unlock;$('manual').onclick=()=>lock('Manual test');$('clear').onclick=()=>{events=[];log('Log cleared');};log('Page loaded');if(document.hidden)lock('Initially hidden');
</script></body></html>
